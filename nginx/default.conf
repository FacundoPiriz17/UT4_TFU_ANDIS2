worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    sendfile on;
    keepalive_timeout 65;

    # OFFLOADING: compresión centralizada en el gateway (también para JSON)
    gzip on;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/css text/plain;

    # THROTTLING: 10 req/s por IP, rechazo con 429 al superar el burst
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    upstream backend {
        server api1:8000;
        server api2:8000;
    }

    server {
        listen 80;
        server_name _;

        # OFFLOADING: servir archivos estáticos directamente
        location /static/ {
            alias /var/www/static/;
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Served-By "gateway-nginx" always;
        }

        # OFFLOADING: compresión + rate limit + proxy
        location / {
            # nodelay: el burst se atiende sin demora y el exceso se rechaza al instante
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        error_page 429 = @rate_limit_error;

        location @rate_limit_error {
            default_type application/json;
            return 429 '{"error":"Too Many Requests","message":"Has excedido el límite de peticiones"}';
        }
    }
}
