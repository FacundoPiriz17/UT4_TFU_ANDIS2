# Override: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up --build
services:
  api1:
    image: api:dev
    build:
      args:
        API_VERSION: dev
        FORCE_UNHEALTHY: "false"
    volumes:
      - .:/app
      - audit_logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  api2:
    image: api:dev
    build:
      args:
        API_VERSION: dev
        FORCE_UNHEALTHY: "false"
    volumes:
      - .:/app
      - audit_logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
